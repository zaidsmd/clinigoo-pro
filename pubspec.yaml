name: clinigoo_pro
description: "Clinigoo Pro - Healthcare Professional Platform for Clinigoo"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.11.1
  go_router: ^17.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.3
  flutter_dotenv: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/svg/
    - assets/fonts/
